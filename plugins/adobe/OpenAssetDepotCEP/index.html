<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenAsset Depot</title>
  <link rel="stylesheet" href="css/panel.css" />
</head>
<body>
  <main>
    <header>
      <div class="mark">OD</div>
      <div><h1>OpenAsset Depot</h1><p id="host-name">Creative Cloud</p></div>
      <button id="refresh" class="icon" title="Refresh" aria-label="Refresh">&#x21bb;</button>
    </header>

    <section id="setup" class="setup hidden">
      <h2>Connect a workspace</h2>
      <label>Workspace root<input id="workspace-root" placeholder="/Studio/Project" /></label>
      <label>oad executable<input id="cli-path" value="oad" /></label>
      <button id="save-settings" class="primary">Use Workspace</button>
    </section>

    <section id="asset" class="asset">
      <div class="eyebrow">ACTIVE DOCUMENT</div>
      <h2 id="file-name">No saved document</h2>
      <p id="file-path">Save the document inside an OpenAsset workspace.</p>
      <div id="status" class="status neutral">Unavailable</div>
    </section>

    <section class="actions">
      <button id="checkout" class="primary">Check Out</button>
      <button id="add">Add to Depot</button>
      <button id="sync">Sync Latest</button>
      <button id="validate">Validate</button>
      <button id="revert">Revert Intent</button>
    </section>

    <section class="submit">
      <label>Submit note<textarea id="description" rows="3" placeholder="What changed in this creative pass?"></textarea></label>
      <button id="submit" class="primary">Submit Changes</button>
    </section>

    <footer>
      <button id="settings-link" class="link">Workspace Settings</button>
      <span id="message" role="status">Ready</span>
    </footer>
  </main>
  <script src="js/panel.js"></script>
</body>
</html>
