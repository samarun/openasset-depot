[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openasset-depot-bridge"
version = "0.1.2"
description = "Host-safe OpenAsset Depot CLI bridge for creative applications"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
where = ["."]
include = ["openasset_depot_bridge*"]
