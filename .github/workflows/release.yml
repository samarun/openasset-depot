name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  source-artifacts:
    name: Server, CLI, integrations, and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release version
        run: ./scripts/check-release-version.py --tag "${GITHUB_REF_NAME}"
      - name: Verify source
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          PYTHONPATH=plugins/common python -m unittest discover -s plugins/common/tests -v
          node --test plugins/common/node/test/openasset-cli.test.js
      - name: Build Linux binaries
        run: cargo build --release -p openasset-api -p oad
      - name: Package Linux binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release/stage/bin
          install -m 0755 target/release/openasset-api release/stage/bin/openasset-api
          install -m 0755 target/release/oad release/stage/bin/oad
          cp README.md Cargo.lock release/stage/
          tar -C release/stage -czf "release/openasset-depot-server-cli-${VERSION}-linux-x86_64.tar.gz" .
          rm -rf release/stage
      - name: Package integrations
        run: |
          ./scripts/package-integrations.py
          cp dist/integrations/* release/
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: release/openasset-depot.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: source-artifacts
          path: release/*
          if-no-files-found: error

  macos-desktop:
    name: Signed macOS desktop
    runs-on: macos-latest
    env:
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Require signing and notarization credentials
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for a tagged desktop release"
              exit 1
            fi
          done
      - name: Verify release version
        run: ./scripts/check-release-version.py --tag "${GITHUB_REF_NAME}"
      - name: Build signed and notarized app
        run: ./scripts/build-desktop-release.sh
      - name: Verify and stage macOS artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP="$BUNDLE/macos/OpenAsset Depot.app"
          codesign --verify --deep --strict "$APP"
          spctl --assess --type execute --verbose "$APP"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "release/OpenAsset-Depot-${VERSION}-macOS-arm64.zip"
          cp "$BUNDLE/dmg/OpenAsset Depot_${VERSION}_aarch64.dmg" \
            "release/OpenAsset-Depot-${VERSION}-macOS-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: release/*
          if-no-files-found: error

  containers:
    name: Publish OCI images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image prefix
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/api:${{ github.ref_name }}
            ${{ steps.image.outputs.prefix }}/api:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: desktop/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/web:${{ github.ref_name }}
            ${{ steps.image.outputs.prefix }}/web:latest

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [source-artifacts, macos-desktop, containers]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-artifacts"
          path: release
          merge-multiple: true
      - name: Generate release checksums
        working-directory: release
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
