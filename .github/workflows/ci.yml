name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: openasset
          POSTGRES_USER: openasset
          POSTGRES_PASSWORD: openasset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openasset -d openasset"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Run API integration flows
        env:
          OAD_BIND_ADDR: 127.0.0.1:18080
          OAD_DATABASE_URL: postgres://openasset:openasset@127.0.0.1:5432/openasset
          OAD_JWT_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef
          OAD_STORAGE_ROOT: /tmp/openasset-ci-objects
          OAD_TEST_BASE_URL: http://127.0.0.1:18080
          OAD_TEST_DATABASE_URL: postgres://openasset:openasset@127.0.0.1:5432/openasset
          RUST_LOG: openasset_api=info,tower_http=info
        run: |
          set -euo pipefail
          cargo run -p openasset-api > /tmp/openasset-api.log 2>&1 &
          echo "$!" > /tmp/openasset-api.pid
          cleanup() {
            exit_code="$?"
            kill "$(cat /tmp/openasset-api.pid)" 2>/dev/null || true
            if [ "$exit_code" -ne 0 ]; then
              cat /tmp/openasset-api.log
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ready >/dev/null
          cargo test -p openasset-api --test required_flows -- --ignored --test-threads=1

  desktop-and-sdk:
    name: Desktop and TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test -- --run
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: ../../desktop/node_modules/.bin/tsc -p tsconfig.json --noEmit
        working-directory: sdk/typescript
      - run: npm audit --audit-level=moderate
        working-directory: desktop

  desktop-native:
    name: Native desktop bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: desktop
      - name: Prepare CLI sidecar for Tauri checks
        run: |
          set -euo pipefail
          target="$(rustc -vV | awk '/^host:/ { print $2 }')"
          cargo build --release -p oad
          mkdir -p desktop/src-tauri/binaries
          cp target/release/oad "desktop/src-tauri/binaries/oad-${target}"
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: ./scripts/build-desktop-release.sh

  integrations:
    name: DCC integration packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/check-release-version.py
      - run: PYTHONPATH=plugins/common python -m unittest discover -s plugins/common/tests -v
      - run: node --test plugins/common/node/test/openasset-cli.test.js
      - run: python -m compileall -q plugins/blender plugins/maya plugins/houdini plugins/nuke
      - run: python -c "import xml.etree.ElementTree as ET; ET.parse('plugins/adobe/OpenAssetDepotCEP/CSXS/manifest.xml'); ET.parse('plugins/resolve/OpenAssetDepotResolve/manifest.xml'); ET.parse('plugins/houdini/openasset_depot_houdini/python_panels/openasset_depot.pypanel')"
      - run: node --check plugins/adobe/OpenAssetDepotCEP/js/panel.js
      - run: node --check plugins/resolve/OpenAssetDepotResolve/main.js
      - run: node --check plugins/resolve/OpenAssetDepotResolve/renderer.js
      - run: ./scripts/package-integrations.py
      - run: sha256sum -c SHA256SUMS
        working-directory: dist/integrations

  docker:
    name: Docker image and compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/api/Dockerfile .
      - run: docker build -f desktop/Dockerfile .
      - run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config
      - run: docker compose -f deploy/docker-compose.ubuntu-nginx.yml --env-file deploy/.env.ubuntu-nginx.example config
