map $http_x_forwarded_proto $oad_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20g;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $oad_forwarded_proto;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_pass http://openasset-api:8080/api/;
    }

    location = /health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $oad_forwarded_proto;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_pass http://openasset-api:8080/health;
    }

    location = /ready {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $oad_forwarded_proto;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_pass http://openasset-api:8080/ready;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
