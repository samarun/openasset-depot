[package]
name = "openasset-api"
version = "0.1.2"
edition.workspace = true
license.workspace = true

[lib]
name = "openasset_api"
path = "src/lib.rs"

[[bin]]
name = "openasset-api"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
argon2 = "0.5"
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
blake3 = "1.5"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
globset = "0.4"
jsonwebtoken = "9"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["catch-panic", "cors", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
async-trait = "0.1.92"
aws-sdk-s3 = { version = "1.143.0", optional = true }
aws-config = { version = "1.11.0", optional = true }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
tempfile = "3"
tower = "0.5"

[features]
default = []
# Enables the S3-compatible object storage backend (AWS S3, MinIO, Ceph, R2).
# Kept opt-in so the default server build stays lean; CI type-checks it via
# `cargo check -p openasset-api --features s3`.
s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
