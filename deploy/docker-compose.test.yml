services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: openasset_test
      POSTGRES_USER: openasset_test
      POSTGRES_PASSWORD: isolated-test-password
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openasset_test -d openasset_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  api-test:
    build:
      context: ..
      dockerfile: server/api/Dockerfile
    environment:
      OAD_BIND_ADDR: 0.0.0.0:8080
      OAD_DATABASE_URL: postgres://openasset_test:isolated-test-password@postgres-test:5432/openasset_test
      OAD_JWT_SECRET: isolated-integration-test-secret-0123456789abcdef
      OAD_STORAGE_ROOT: /tmp/openasset-objects
      OAD_MAX_UPLOAD_BYTES: 1073741824
      OAD_CHUNK_SIZE_BYTES: 1048576
      OAD_REQUEST_TIMEOUT_SECONDS: 300
      OAD_CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      OAD_ALLOW_SIGNUPS: true
      RUST_LOG: warn
    depends_on:
      postgres-test:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - test_objects:/tmp/openasset-objects
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  test_objects:
